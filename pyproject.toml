[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-distributed-framework"
version = "0.1.0"
description = "Adaptive Distributed Parallel Processing Framework for Large-Scale Biomedical Document Processing using Intelligent Workload Scheduling"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "AdaptiveDistributedFramework Team" }]
requires-python = ">=3.12"
keywords = [
    "distributed-systems",
    "parallel-processing",
    "biomedical",
    "document-processing",
    "ocr",
    "rag",
    "ray",
    "scheduling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pyyaml>=6.0.1",
    # Ray only has Linux/macOS wheels; install manually on Linux workers.
    # On Windows dev machines, framework runs in Ray-less simulation mode.
    "ray>=2.10.0 ; sys_platform != 'win32'",
    "psutil>=5.9.8",
    "rich>=13.7.0",
    "pypdf>=4.0.0",
    # Document processing engine — PDF rendering and array ops
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3.0",
    "isort>=5.13.2",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.6",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.12",
]
ray = [
    # Install this extra on Linux/macOS CI workers
    "ray>=2.10.0 ; sys_platform != 'win32'",
]
dashboard = [
    "streamlit>=1.35.0",
    "plotly>=5.21.0",
    "pandas>=2.2.0",
]
docs = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.15",
]

[project.scripts]
adaptive-framework = "adaptive_framework.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | _build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["adaptive_framework"]
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "ray: tests requiring a live Ray cluster (skip on Windows)",
    "integration: end-to-end integration tests",
    "unit: pure unit tests with no external dependencies",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["ray.*", "psutil.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    # Phase 3 scope — not yet tested
    "src/adaptive_framework/dataset_builder/*",
    "src/adaptive_framework/document_processing/*",
    "src/adaptive_framework/rag/*",
    "src/adaptive_framework/logging/*",
    "src/adaptive_framework/di/*",
    "src/adaptive_framework/metadata_generator/*",
    "src/adaptive_framework/evaluation/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50  # Phase 2B: distributed modules tested; raise to 75 in Phase 3
