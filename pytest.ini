[pytest]
minversion = 8.0
addopts =
    -ra
    -q
    --tb=short
    --strict-markers
    --cov=adaptive_framework
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=50

testpaths = tests
pythonpath = src

asyncio_mode = auto

markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (may require Ray or file system)
    performance: Performance benchmarks
    slow: Tests that take more than 5 seconds
    ray: Tests requiring a live Ray cluster (skip on Windows)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
